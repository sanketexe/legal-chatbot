<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal AI Assistant - Powered by Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .chat-header p {
            margin-top: 5px;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .message.ai .message-content {
            background: white;
            border: 1px solid #e1e8ed;
            border-radius: 20px 20px 20px 5px;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 5px 20px;
        }
        
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e8ed;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        #messageInput {
            flex: 1;
            padding: 15px;
            border: 1px solid #e1e8ed;
            border-radius: 25px;
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 50px;
            max-height: 120px;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        #sendBtn:hover {
            transform: scale(1.05);
        }
        
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-style: italic;
        }
        
        .typing-dots {
            display: flex;
            gap: 3px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }
        
        .welcome-message h2 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .quick-question {
            background: #f1f3f4;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        
        .quick-question:hover {
            background: #667eea;
            color: white;
        }
        
        .status {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🏛️ Legal AI Assistant</h1>
            <p>Powered by Google Gemini AI • Specializing in Indian Law</p>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message">
                <h2>Welcome to your Legal AI Assistant!</h2>
                <p>I can help you with questions about Indian law, constitutional rights, contracts, and more.</p>
                
                <div class="quick-questions">
                    <button class="quick-question" onclick="askQuestion('What is Article 21 of the Indian Constitution?')">Article 21</button>
                    <button class="quick-question" onclick="askQuestion('How to register a company in India?')">Company Registration</button>
                    <button class="quick-question" onclick="askQuestion('What are the rights of tenants in India?')">Tenant Rights</button>
                    <button class="quick-question" onclick="askQuestion('Explain divorce laws in India')">Divorce Laws</button>
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-group">
                <textarea 
                    id="messageInput" 
                    placeholder="Ask me about Indian law, contracts, rights, or any legal question..."
                    rows="1"
                    onkeypress="handleKeyPress(event)"
                ></textarea>
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
            <div class="status" id="status">Ready to help with your legal questions</div>
        </div>
    </div>

    <script>
        let isTyping = false;
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function askQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isTyping) return;
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                hideTypingIndicator();
                
                if (data.status === 'success') {
                    addMessage(data.response, 'ai');
                    updateStatus('Response received');
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                    updateStatus('Error occurred');
                }
                
            } catch (error) {
                hideTypingIndicator();
                addMessage('Sorry, I could not connect to the server. Please try again.', 'ai');
                updateStatus('Connection error');
                console.error('Error:', error);
            }
        }
        
        function addMessage(content, sender) {
            const container = document.getElementById('messagesContainer');
            
            // Remove welcome message if this is the first real message
            const welcomeMsg = container.querySelector('.welcome-message');
            if (welcomeMsg && sender === 'user') {
                welcomeMsg.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (sender === 'ai') {
                // Format AI responses with better readability
                contentDiv.innerHTML = formatLegalResponse(content);
            } else {
                contentDiv.textContent = content;
            }
            
            messageDiv.appendChild(contentDiv);
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function formatLegalResponse(content) {
            // Basic formatting for legal responses
            let formatted = content;
            
            // Make sections bold
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Format bullet points
            formatted = formatted.replace(/\n\*/g, '<br>•');
            formatted = formatted.replace(/\n-/g, '<br>•');
            
            // Format numbered points
            formatted = formatted.replace(/\n(\d+\.)/g, '<br><strong>$1</strong>');
            
            // Convert line breaks
            formatted = formatted.replace(/\n/g, '<br>');
            
            // Highlight legal terms
            const legalTerms = ['Article', 'Section', 'Act', 'Constitution', 'Supreme Court', 'High Court'];
            legalTerms.forEach(term => {
                const regex = new RegExp(`\\b${term}\\b`, 'gi');
                formatted = formatted.replace(regex, `<strong style="color: #667eea;">${term}</strong>`);
            });
            
            return formatted;
        }
        
        function showTypingIndicator() {
            isTyping = true;
            document.getElementById('sendBtn').disabled = true;
            updateStatus('AI is thinking...');
            
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content typing-indicator';
            contentDiv.innerHTML = `
                AI is typing
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            
            typingDiv.appendChild(contentDiv);
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function hideTypingIndicator() {
            isTyping = false;
            document.getElementById('sendBtn').disabled = false;
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            setTimeout(() => {
                document.getElementById('status').textContent = 'Ready to help with your legal questions';
            }, 3000);
        }
        
        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
