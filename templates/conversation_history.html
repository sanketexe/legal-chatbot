<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation History - LegalAssist Pro</title>
    
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .conversation-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .conversation-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--box-shadow);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .conversation-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-lg);
        }
        
        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .conversation-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-900);
            flex: 1;
        }
        
        .conversation-date {
            font-size: 0.875rem;
            color: var(--gray-500);
        }
        
        .conversation-preview {
            color: var(--gray-600);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        
        .conversation-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .conversation-stats {
            display: flex;
            gap: 1.5rem;
            font-size: 0.875rem;
            color: var(--gray-500);
        }
        
        .conversation-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .search-filters {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--box-shadow);
            margin-bottom: 1.5rem;
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        
        .pagination button {
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-300);
            background: white;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--gray-100);
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }
        
        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }
        
        .empty-state-description {
            color: var(--gray-500);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Simplified sidebar for standalone page -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>⚖️ LegalAssist Pro</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="window.location.href='/dashboard'">
                    <span class="nav-item-icon">📊</span>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item active">
                    <span class="nav-item-icon">📝</span>
                    <span>Conversations</span>
                </div>
                <div class="nav-item" onclick="window.location.href='/bookmarks'">
                    <span class="nav-item-icon">🔖</span>
                    <span>Bookmarks</span>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Conversation History</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="createNewConversation()">
                        <i class="fas fa-plus"></i> New Conversation
                    </button>
                </div>
            </header>
            
            <div class="content-area">
                <!-- Search & Filters -->
                <div class="search-filters">
                    <div class="filter-row">
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="text" id="search-input" class="form-control" 
                                   placeholder="Search conversations..." 
                                   onkeyup="handleSearch(event)">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <select id="sort-select" class="form-control" onchange="handleSort()">
                                <option value="created_at_desc">Newest First</option>
                                <option value="created_at_asc">Oldest First</option>
                                <option value="updated_at_desc">Recently Updated</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <select id="limit-select" class="form-control" onchange="handleLimitChange()">
                                <option value="10">10 per page</option>
                                <option value="20" selected>20 per page</option>
                                <option value="50">50 per page</option>
                            </select>
                        </div>
                        <button class="btn btn-outline" onclick="resetFilters()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </div>
                
                <!-- Conversations List -->
                <div id="conversations-container">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p class="loading-message">Loading conversations...</p>
                    </div>
                </div>
                
                <!-- Pagination -->
                <div id="pagination-container"></div>
            </div>
        </main>
    </div>
    
    <script src="/static/js/api-client.js"></script>
    <script>
        // State
        let currentPage = 1;
        let currentLimit = 20;
        let currentSort = 'created_at_desc';
        let currentSearch = '';
        let totalPages = 1;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
        });
        
        // Load conversations
        async function loadConversations() {
            const container = document.getElementById('conversations-container');
            
            try {
                UIUtils.showLoading(container, 'Loading conversations...');
                
                const data = await ConversationsAPI.list(currentPage, currentLimit);
                
                if (!data.conversations || data.conversations.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-title">No conversations yet</div>
                            <div class="empty-state-description">
                                Start a new conversation to get personalized legal assistance
                            </div>
                            <button class="btn btn-primary" onclick="createNewConversation()">
                                <i class="fas fa-plus"></i> Start First Conversation
                            </button>
                        </div>
                    `;
                    return;
                }
                
                // Update pagination info
                totalPages = Math.ceil(data.total / currentLimit);
                
                // Render conversations
                container.innerHTML = `
                    <div class="conversation-list">
                        ${data.conversations.map(conv => renderConversation(conv)).join('')}
                    </div>
                `;
                
                // Render pagination
                renderPagination(data.total);
                
            } catch (error) {
                console.error('Error loading conversations:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">Failed to load conversations</div>
                        <div class="empty-state-description">${error.message}</div>
                        <button class="btn btn-primary" onclick="loadConversations()">
                            <i class="fas fa-redo"></i> Try Again
                        </button>
                    </div>
                `;
            }
        }
        
        // Render single conversation
        function renderConversation(conv) {
            const lastMessage = conv.messages && conv.messages.length > 0 
                ? conv.messages[conv.messages.length - 1].content 
                : 'No messages';
            
            return `
                <div class="conversation-card" onclick="openConversation('${conv.id}')">
                    <div class="conversation-header">
                        <div class="conversation-title">${conv.title || 'Untitled Conversation'}</div>
                        <div class="conversation-date">${UIUtils.formatDate(conv.created_at)}</div>
                    </div>
                    <div class="conversation-preview">${UIUtils.truncateText(lastMessage, 150)}</div>
                    <div class="conversation-footer">
                        <div class="conversation-stats">
                            <span><i class="fas fa-comments"></i> ${conv.message_count || 0} messages</span>
                            <span><i class="fas fa-clock"></i> ${UIUtils.formatRelativeTime(conv.updated_at || conv.created_at)}</span>
                        </div>
                        <div class="conversation-actions">
                            <button class="btn btn-sm btn-outline" 
                                    onclick="event.stopPropagation(); editConversation('${conv.id}')"
                                    title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline" 
                                    onclick="event.stopPropagation(); bookmarkConversation('${conv.id}', '${conv.title}')"
                                    title="Bookmark">
                                <i class="fas fa-bookmark"></i>
                            </button>
                            <button class="btn btn-sm btn-outline" 
                                    onclick="event.stopPropagation(); exportConversationModal('${conv.id}')"
                                    title="Export">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" 
                                    onclick="event.stopPropagation(); deleteConversation('${conv.id}')"
                                    title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Render pagination
        function renderPagination(total) {
            const container = document.getElementById('pagination-container');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let buttons = [];
            
            // Previous button
            buttons.push(`
                <button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
            `);
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    buttons.push(`
                        <button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">
                            ${i}
                        </button>
                    `);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    buttons.push('<button disabled>...</button>');
                }
            }
            
            // Next button
            buttons.push(`
                <button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            `);
            
            container.innerHTML = `<div class="pagination">${buttons.join('')}</div>`;
        }
        
        // Actions
        async function createNewConversation() {
            try {
                const result = await ConversationsAPI.create();
                window.location.href = `/conversation?id=${result.conversation.id}`;
            } catch (error) {
                UIUtils.showNotification('Failed to create conversation', 'error');
            }
        }
        
        function openConversation(id) {
            window.location.href = `/conversation?id=${id}`;
        }
        
        async function editConversation(id) {
            const newTitle = prompt('Enter new title:');
            if (newTitle) {
                try {
                    await ConversationsAPI.update(id, { title: newTitle });
                    UIUtils.showNotification('Conversation updated', 'success');
                    loadConversations();
                } catch (error) {
                    UIUtils.showNotification('Failed to update conversation', 'error');
                }
            }
        }
        
        async function bookmarkConversation(id, title) {
            await BookmarkUtils.showBookmarkModal('conversation', id, title);
        }
        
        async function exportConversationModal(id) {
            await ExportUtils.showExportModal(id);
        }
        
        async function deleteConversation(id) {
            UIUtils.confirm(
                'Are you sure you want to delete this conversation?',
                async () => {
                    try {
                        await ConversationsAPI.delete(id);
                        UIUtils.showNotification('Conversation deleted', 'success');
                        loadConversations();
                    } catch (error) {
                        UIUtils.showNotification('Failed to delete conversation', 'error');
                    }
                }
            );
        }
        
        // Filters
        function handleSearch(event) {
            if (event.key === 'Enter') {
                currentSearch = event.target.value;
                currentPage = 1;
                loadConversations();
            }
        }
        
        function handleSort() {
            currentSort = document.getElementById('sort-select').value;
            currentPage = 1;
            loadConversations();
        }
        
        function handleLimitChange() {
            currentLimit = parseInt(document.getElementById('limit-select').value);
            currentPage = 1;
            loadConversations();
        }
        
        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('sort-select').value = 'created_at_desc';
            document.getElementById('limit-select').value = '20';
            currentSearch = '';
            currentSort = 'created_at_desc';
            currentLimit = 20;
            currentPage = 1;
            loadConversations();
        }
        
        function goToPage(page) {
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                loadConversations();
            }
        }
    </script>
</body>
</html>
