<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Chats - LegalAssist Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* Search Section */
        .search-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 18px 60px 18px 55px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #667eea;
        }

        .clear-search {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            display: none;
        }

        .clear-search:hover {
            color: #1a202c;
        }

        /* Filters */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }

        .filter-select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Results Section */
        .results-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .results-count {
            font-size: 18px;
            font-weight: 600;
            color: #1a202c;
        }

        .sort-by {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-by select {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Chat Result Card */
        .chat-result {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-result:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .chat-result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 5px;
        }

        .chat-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #64748b;
        }

        .chat-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-preview {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .chat-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 4px 12px;
            background: #ede9fe;
            color: #6d28d9;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .bookmark-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #cbd5e0;
            transition: all 0.3s;
        }

        .bookmark-btn:hover,
        .bookmark-btn.bookmarked {
            color: #f59e0b;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 64px;
            color: #cbd5e0;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #64748b;
            margin-bottom: 25px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading i {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .results-header {
                flex-direction: column;
                align-items: start;
                gap: 15px;
            }

            .chat-result-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-search"></i>
                Search Chats
            </h1>
            <a href="/" class="btn btn-primary">
                <i class="fas fa-comments"></i> Back to Chat
            </a>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="Search your conversations by keywords, topics, or questions..."
                    autocomplete="off"
                >
                <button class="clear-search" id="clearSearch">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Date Range</label>
                    <select class="filter-select" id="dateFilter">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                        <option value="3months">Last 3 Months</option>
                        <option value="year">This Year</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Topic</label>
                    <select class="filter-select" id="topicFilter">
                        <option value="all">All Topics</option>
                        <option value="family">Family Law</option>
                        <option value="property">Property Law</option>
                        <option value="criminal">Criminal Law</option>
                        <option value="civil">Civil Law</option>
                        <option value="constitutional">Constitutional Law</option>
                        <option value="business">Business Law</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Message Count</label>
                    <select class="filter-select" id="messageFilter">
                        <option value="all">Any Length</option>
                        <option value="short">Short (1-5 messages)</option>
                        <option value="medium">Medium (6-15 messages)</option>
                        <option value="long">Long (16+ messages)</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Bookmarked</label>
                    <select class="filter-select" id="bookmarkFilter">
                        <option value="all">All Chats</option>
                        <option value="bookmarked">Bookmarked Only</option>
                        <option value="unbookmarked">Not Bookmarked</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <div class="results-count" id="resultsCount">
                    Loading...
                </div>
                <div class="sort-by">
                    <span>Sort by:</span>
                    <select id="sortBy">
                        <option value="recent">Most Recent</option>
                        <option value="oldest">Oldest First</option>
                        <option value="messages">Most Messages</option>
                        <option value="relevance">Relevance</option>
                    </select>
                </div>
            </div>

            <div id="resultsContainer">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading your conversations...</p>
                </div>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <!-- Pagination buttons will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        let allSessions = [];
        let filteredSessions = [];
        let bookmarkedSessions = JSON.parse(localStorage.getItem('bookmarkedSessions') || '[]');
        let currentPage = 1;
        const itemsPerPage = 10;

        // Initialize
        async function init() {
            await loadSessions();
            setupEventListeners();
            applyFilters();
        }

        // Load sessions from API
        async function loadSessions() {
            try {
                const response = await fetch('/api/chat/sessions');
                if (response.ok) {
                    const data = await response.json();
                    allSessions = data.sessions || [];
                    console.log(`Loaded ${allSessions.length} sessions`);
                } else {
                    throw new Error('Failed to load sessions');
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
                showEmptyState('error');
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 300));
            document.getElementById('clearSearch').addEventListener('click', clearSearch);
            document.getElementById('dateFilter').addEventListener('change', applyFilters);
            document.getElementById('topicFilter').addEventListener('change', applyFilters);
            document.getElementById('messageFilter').addEventListener('change', applyFilters);
            document.getElementById('bookmarkFilter').addEventListener('change', applyFilters);
            document.getElementById('sortBy').addEventListener('change', applyFilters);
        }

        // Apply all filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;
            const topicFilter = document.getElementById('topicFilter').value;
            const messageFilter = document.getElementById('messageFilter').value;
            const bookmarkFilter = document.getElementById('bookmarkFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            // Show/hide clear button
            document.getElementById('clearSearch').style.display = searchTerm ? 'block' : 'none';

            // Filter sessions
            filteredSessions = allSessions.filter(session => {
                // Search filter
                if (searchTerm) {
                    const titleMatch = (session.title || '').toLowerCase().includes(searchTerm);
                    const contentMatch = session.messages && session.messages.some(msg => 
                        msg.content.toLowerCase().includes(searchTerm)
                    );
                    if (!titleMatch && !contentMatch) return false;
                }

                // Date filter
                if (dateFilter !== 'all') {
                    if (!matchesDateFilter(session.created_at, dateFilter)) return false;
                }

                // Topic filter
                if (topicFilter !== 'all') {
                    if (!matchesTopic(session, topicFilter)) return false;
                }

                // Message count filter
                if (messageFilter !== 'all') {
                    const count = session.message_count || 0;
                    if (messageFilter === 'short' && count > 5) return false;
                    if (messageFilter === 'medium' && (count < 6 || count > 15)) return false;
                    if (messageFilter === 'long' && count < 16) return false;
                }

                // Bookmark filter
                if (bookmarkFilter !== 'all') {
                    const isBookmarked = bookmarkedSessions.includes(session.id);
                    if (bookmarkFilter === 'bookmarked' && !isBookmarked) return false;
                    if (bookmarkFilter === 'unbookmarked' && isBookmarked) return false;
                }

                return true;
            });

            // Sort sessions
            sortSessions(sortBy);

            // Reset to page 1
            currentPage = 1;

            // Display results
            displayResults();
        }

        // Match date filter
        function matchesDateFilter(dateString, filter) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = diff / (1000 * 60 * 60 * 24);

            switch(filter) {
                case 'today': return days < 1;
                case 'week': return days < 7;
                case 'month': return days < 30;
                case '3months': return days < 90;
                case 'year': return days < 365;
                default: return true;
            }
        }

        // Match topic
        function matchesTopic(session, topic) {
            const title = (session.title || '').toLowerCase();
            const keywords = {
                'family': ['family', 'marriage', 'divorce', 'custody', 'adoption'],
                'property': ['property', 'land', 'ownership', 'lease', 'rent'],
                'criminal': ['criminal', 'theft', 'assault', 'police', 'ipc'],
                'civil': ['civil', 'contract', 'tort', 'damages', 'negligence'],
                'constitutional': ['constitution', 'fundamental', 'rights', 'article'],
                'business': ['business', 'company', 'corporate', 'contract'],
            };

            if (keywords[topic]) {
                return keywords[topic].some(keyword => title.includes(keyword));
            }
            return true;
        }

        // Sort sessions
        function sortSessions(sortBy) {
            switch(sortBy) {
                case 'recent':
                    filteredSessions.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                    break;
                case 'oldest':
                    filteredSessions.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                    break;
                case 'messages':
                    filteredSessions.sort((a, b) => (b.message_count || 0) - (a.message_count || 0));
                    break;
                case 'relevance':
                    // Already filtered by relevance
                    break;
            }
        }

        // Display results
        function displayResults() {
            const container = document.getElementById('resultsContainer');
            const count = document.getElementById('resultsCount');

            // Update count
            count.textContent = `${filteredSessions.length} conversation${filteredSessions.length !== 1 ? 's' : ''} found`;

            // Calculate pagination
            const totalPages = Math.ceil(filteredSessions.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageResults = filteredSessions.slice(startIndex, endIndex);

            // Display results or empty state
            if (filteredSessions.length === 0) {
                showEmptyState('no-results');
                document.getElementById('pagination').style.display = 'none';
            } else {
                container.innerHTML = pageResults.map(session => createChatCard(session)).join('');
                displayPagination(totalPages);
            }
        }

        // Create chat card HTML
        function createChatCard(session) {
            const isBookmarked = bookmarkedSessions.includes(session.id);
            const date = formatDate(session.updated_at);
            const preview = session.title || 'No preview available';
            const topic = detectTopic(session);

            return `
                <div class="chat-result" onclick="openSession('${session.id}')">
                    <div class="chat-result-header">
                        <div>
                            <div class="chat-title">${escapeHtml(session.title || 'Untitled Chat')}</div>
                            <div class="chat-meta">
                                <span><i class="fas fa-clock"></i> ${date}</span>
                                <span><i class="fas fa-message"></i> ${session.message_count || 0} messages</span>
                            </div>
                        </div>
                        <button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" 
                                onclick="toggleBookmark(event, '${session.id}')">
                            <i class="fas fa-bookmark"></i>
                        </button>
                    </div>
                    <div class="chat-preview">${escapeHtml(preview)}</div>
                    ${topic ? `<div class="chat-tags"><span class="tag">${topic}</span></div>` : ''}
                </div>
            `;
        }

        // Detect topic from session
        function detectTopic(session) {
            const title = (session.title || '').toLowerCase();
            if (title.includes('family') || title.includes('divorce')) return 'Family Law';
            if (title.includes('property') || title.includes('land')) return 'Property Law';
            if (title.includes('criminal') || title.includes('ipc')) return 'Criminal Law';
            if (title.includes('constitutional') || title.includes('rights')) return 'Constitutional';
            if (title.includes('business') || title.includes('company')) return 'Business Law';
            return null;
        }

        // Toggle bookmark
        function toggleBookmark(event, sessionId) {
            event.stopPropagation();
            
            if (bookmarkedSessions.includes(sessionId)) {
                bookmarkedSessions = bookmarkedSessions.filter(id => id !== sessionId);
            } else {
                bookmarkedSessions.push(sessionId);
            }
            
            localStorage.setItem('bookmarkedSessions', JSON.stringify(bookmarkedSessions));
            applyFilters(); // Refresh display
        }

        // Open session
        function openSession(sessionId) {
            window.location.href = `/?session=${sessionId}`;
        }

        // Clear search
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').style.display = 'none';
            applyFilters();
        }

        // Show empty state
        function showEmptyState(type) {
            const container = document.getElementById('resultsContainer');
            
            if (type === 'no-results') {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>No conversations found</h3>
                        <p>Try adjusting your search filters or search terms</p>
                        <button class="btn btn-primary" onclick="clearAllFilters()">Clear All Filters</button>
                    </div>
                `;
            } else if (type === 'error') {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error loading conversations</h3>
                        <p>Please try again or contact support</p>
                        <button class="btn btn-primary" onclick="init()">Retry</button>
                    </div>
                `;
            }
        }

        // Display pagination
        function displayPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';
            
            let html = `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `
                        <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                            ${i}
                        </button>
                    `;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += '<span>...</span>';
                }
            }

            html += `
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;

            pagination.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            displayResults();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Clear all filters
        function clearAllFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = 'all';
            document.getElementById('topicFilter').value = 'all';
            document.getElementById('messageFilter').value = 'all';
            document.getElementById('bookmarkFilter').value = 'all';
            applyFilters();
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return `${days} days ago`;
            return date.toLocaleDateString();
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
