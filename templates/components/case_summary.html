<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Summary Component</title>
    <style>
        /* Case Summary Widget Styles */
        .case-summary-widget {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin: 20px 0;
            max-width: 900px;
        }
        
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e1e8ed;
        }
        
        .summary-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            flex: 1;
        }
        
        .summary-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .length-selector {
            display: flex;
            gap: 5px;
            background: #f5f8fa;
            padding: 4px;
            border-radius: 8px;
        }
        
        .length-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: #657786;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .length-btn:hover {
            background: #e1e8ed;
        }
        
        .length-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 8px 12px;
            border: 1px solid #e1e8ed;
            background: white;
            color: #657786;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-btn:hover {
            background: #f5f8fa;
            border-color: #667eea;
            color: #667eea;
        }
        
        .summary-metadata {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #657786;
        }
        
        .metadata-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .metadata-label {
            font-weight: 600;
        }
        
        .summary-content {
            margin-bottom: 20px;
        }
        
        .summary-section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-icon {
            font-size: 18px;
        }
        
        .section-text {
            line-height: 1.8;
            color: #14171a;
            font-size: 14px;
            text-align: justify;
        }
        
        .summary-main-text {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            line-height: 1.8;
            color: #14171a;
            font-size: 15px;
            margin-bottom: 25px;
            text-align: justify;
        }
        
        .key-points {
            margin-top: 25px;
        }
        
        .key-points-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .key-point {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #34a853;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            gap: 10px;
        }
        
        .key-point::before {
            content: '✓';
            color: #34a853;
            font-weight: bold;
            font-size: 16px;
        }
        
        .loading-summary {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #657786;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e1e8ed;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 15px;
            font-weight: 500;
        }
        
        .error-summary {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            padding: 20px;
            color: #c53030;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .error-icon {
            font-size: 24px;
        }
        
        .summary-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #657786;
        }
        
        .summary-stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .toggle-details-btn {
            padding: 8px 16px;
            border: 1px solid #e1e8ed;
            background: white;
            color: #667eea;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .toggle-details-btn:hover {
            background: #f5f8fa;
            border-color: #667eea;
        }
        
        .detailed-sections {
            margin-top: 20px;
            display: none;
        }
        
        .detailed-sections.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .method-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            font-size: 11px;
            font-weight: 600;
            border-radius: 12px;
            text-transform: uppercase;
        }
        
        .cached-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #34a853;
            color: white;
            font-size: 11px;
            font-weight: 600;
            border-radius: 12px;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .case-summary-widget {
                padding: 16px;
                margin: 15px 0;
            }
            
            .summary-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .summary-controls {
                width: 100%;
                flex-direction: column;
            }
            
            .length-selector {
                width: 100%;
                justify-content: space-between;
            }
            
            .action-buttons {
                width: 100%;
            }
            
            .action-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>

<!-- Case Summary Widget Template -->
<div id="caseSummaryWidget" class="case-summary-widget">
    <!-- Header -->
    <div class="summary-header">
        <div class="summary-title" id="summaryTitle">Case Summary</div>
        <div class="summary-controls">
            <div class="length-selector">
                <button class="length-btn" data-length="short">Short</button>
                <button class="length-btn active" data-length="medium">Medium</button>
                <button class="length-btn" data-length="long">Long</button>
            </div>
            <div class="action-buttons">
                <button class="action-btn" id="copySummaryBtn" title="Copy summary">
                    📋 Copy
                </button>
                <button class="action-btn" id="exportSummaryBtn" title="Export as PDF">
                    📄 Export
                </button>
            </div>
        </div>
    </div>
    
    <!-- Metadata -->
    <div class="summary-metadata" id="summaryMetadata">
        <div class="metadata-item">
            <span class="metadata-label">Court:</span>
            <span id="summaryCase"></span>
        </div>
        <div class="metadata-item">
            <span class="metadata-label">Year:</span>
            <span id="summaryYear">2020</span>
        </div>
        <div class="metadata-item">
            <span class="metadata-label">Words:</span>
            <span id="summaryWordCount">0</span>
        </div>
        <div class="metadata-item">
            <span class="method-badge" id="summaryMethod">Hybrid</span>
        </div>
    </div>
    
    <!-- Loading State -->
    <div class="loading-summary" id="loadingSummary" style="display: none;">
        <div class="spinner"></div>
        <div class="loading-text">Generating summary...</div>
    </div>
    
    <!-- Error State -->
    <div class="error-summary" id="errorSummary" style="display: none;">
        <span class="error-icon">⚠️</span>
        <div id="errorMessage">Failed to generate summary</div>
    </div>
    
    <!-- Summary Content -->
    <div class="summary-content" id="summaryContent">
        <!-- Main Summary -->
        <div class="summary-main-text" id="summaryMainText">
            Loading summary...
        </div>
        
        <!-- Toggle Details Button -->
        <button class="toggle-details-btn" id="toggleDetailsBtn">
            Show Detailed Breakdown ▼
        </button>
        
        <!-- Detailed Sections (collapsible) -->
        <div class="detailed-sections" id="detailedSections">
            <!-- Facts -->
            <div class="summary-section" id="factsSection">
                <div class="section-title">
                    <span class="section-icon">📋</span>
                    Facts
                </div>
                <div class="section-text" id="summaryFacts"></div>
            </div>
            
            <!-- Issues -->
            <div class="summary-section" id="issuesSection">
                <div class="section-title">
                    <span class="section-icon">⚖️</span>
                    Legal Issues
                </div>
                <div class="section-text" id="summaryIssues"></div>
            </div>
            
            <!-- Reasoning -->
            <div class="summary-section" id="reasoningSection">
                <div class="section-title">
                    <span class="section-icon">🧠</span>
                    Court's Reasoning
                </div>
                <div class="section-text" id="summaryReasoning"></div>
            </div>
            
            <!-- Judgment -->
            <div class="summary-section" id="judgmentSection">
                <div class="section-title">
                    <span class="section-icon">⚖️</span>
                    Final Judgment
                </div>
                <div class="section-text" id="summaryJudgment"></div>
            </div>
        </div>
        
        <!-- Key Points -->
        <div class="key-points">
            <div class="section-title">
                <span class="section-icon">🔑</span>
                Key Points
            </div>
            <ul class="key-points-list" id="keyPointsList">
                <li class="key-point">Loading key points...</li>
            </ul>
        </div>
    </div>
    
    <!-- Footer -->
    <div class="summary-footer">
        <div class="summary-stats">
            <div class="stat-item">
                <span>Generated:</span>
                <span id="summaryTimestamp">Just now</span>
            </div>
        </div>
        <div id="cachedBadge" style="display: none;">
            <span class="cached-badge">📦 Cached</span>
        </div>
    </div>
</div>

<script>
// Case Summary Widget JavaScript
class CaseSummaryWidget {
    constructor(containerId = 'caseSummaryWidget') {
        this.container = document.getElementById(containerId);
        this.currentCaseId = null;
        this.currentLength = 'medium';
        this.currentMethod = 'hybrid';
        this.summaryData = null;
        
        this.initializeEventListeners();
    }
    
    initializeEventListeners() {
        // Length selector buttons
        const lengthButtons = this.container.querySelectorAll('.length-btn');
        lengthButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const length = btn.dataset.length;
                this.changeLength(length);
            });
        });
        
        // Copy button
        document.getElementById('copySummaryBtn').addEventListener('click', () => {
            this.copySummary();
        });
        
        // Export button
        document.getElementById('exportSummaryBtn').addEventListener('click', () => {
            this.exportSummary();
        });
        
        // Toggle details button
        document.getElementById('toggleDetailsBtn').addEventListener('click', () => {
            this.toggleDetails();
        });
    }
    
    async loadSummary(caseId, caseData = null, length = 'medium', method = 'hybrid') {
        this.currentCaseId = caseId;
        this.currentLength = length;
        this.currentMethod = method;
        
        // Show loading state
        this.showLoading();
        
        try {
            const response = await fetch('/api/summarize-case', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    case_id: caseId,
                    case_data: caseData,
                    length: length,
                    method: method,
                    use_cache: true
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                this.summaryData = data;
                this.displaySummary(data);
            } else {
                this.showError(data.error || 'Failed to generate summary');
            }
        } catch (error) {
            console.error('Error loading summary:', error);
            this.showError('Failed to connect to server');
        }
    }
    
    displaySummary(data) {
        // Hide loading/error
        document.getElementById('loadingSummary').style.display = 'none';
        document.getElementById('errorSummary').style.display = 'none';
        document.getElementById('summaryContent').style.display = 'block';
        
        // Update title
        document.getElementById('summaryTitle').textContent = data.title || 'Case Summary';
        
        // Update metadata
        document.getElementById('summaryCoourt').textContent = data.court || 'Unknown';
        document.getElementById('summaryYear').textContent = data.year || 'N/A';
        document.getElementById('summaryWordCount').textContent = data.word_count || 0;
        document.getElementById('summaryMethod').textContent = (data.method || 'hybrid').toUpperCase();
        
        // Show cached badge if applicable
        if (data.cached) {
            document.getElementById('cachedBadge').style.display = 'block';
        }
        
        // Update main summary
        document.getElementById('summaryMainText').textContent = data.summary;
        
        // Update detailed sections
        document.getElementById('summaryFacts').textContent = data.facts || 'Not available';
        document.getElementById('summaryIssues').textContent = data.issues || 'Not available';
        document.getElementById('summaryReasoning').textContent = data.reasoning || 'Not available';
        document.getElementById('summaryJudgment').textContent = data.judgment || 'Not available';
        
        // Update key points
        const keyPointsList = document.getElementById('keyPointsList');
        keyPointsList.innerHTML = '';
        
        if (data.key_points && data.key_points.length > 0) {
            data.key_points.forEach(point => {
                const li = document.createElement('li');
                li.className = 'key-point';
                li.textContent = point;
                keyPointsList.appendChild(li);
            });
        } else {
            keyPointsList.innerHTML = '<li class="key-point">No key points available</li>';
        }
        
        // Update timestamp
        document.getElementById('summaryTimestamp').textContent = this.getRelativeTime(data.created_at);
        
        // Update active length button
        this.updateLengthButtons(data.length);
    }
    
    showLoading() {
        document.getElementById('summaryContent').style.display = 'none';
        document.getElementById('errorSummary').style.display = 'none';
        document.getElementById('loadingSummary').style.display = 'flex';
    }
    
    showError(message) {
        document.getElementById('summaryContent').style.display = 'none';
        document.getElementById('loadingSummary').style.display = 'none';
        document.getElementById('errorSummary').style.display = 'flex';
        document.getElementById('errorMessage').textContent = message;
    }
    
    async changeLength(length) {
        if (length === this.currentLength) return;
        
        this.currentLength = length;
        this.updateLengthButtons(length);
        
        // Reload summary with new length
        if (this.currentCaseId) {
            await this.loadSummary(this.currentCaseId, null, length, this.currentMethod);
        }
    }
    
    updateLengthButtons(activeLength) {
        const lengthButtons = this.container.querySelectorAll('.length-btn');
        lengthButtons.forEach(btn => {
            if (btn.dataset.length === activeLength) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
    
    copySummary() {
        if (!this.summaryData) return;
        
        let text = `${this.summaryData.title}\n\n`;
        text += `Summary:\n${this.summaryData.summary}\n\n`;
        
        if (this.summaryData.key_points && this.summaryData.key_points.length > 0) {
            text += `Key Points:\n`;
            this.summaryData.key_points.forEach((point, i) => {
                text += `${i + 1}. ${point}\n`;
            });
        }
        
        navigator.clipboard.writeText(text).then(() => {
            // Show success feedback
            const btn = document.getElementById('copySummaryBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✓ Copied!';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy:', err);
            alert('Failed to copy summary');
        });
    }
    
    exportSummary() {
        if (!this.summaryData) return;
        
        // Create text file export
        let text = `CASE SUMMARY\n${'='.repeat(50)}\n\n`;
        text += `Title: ${this.summaryData.title}\n`;
        text += `Court: ${this.summaryData.court}\n`;
        text += `Year: ${this.summaryData.year}\n`;
        text += `Length: ${this.summaryData.length}\n`;
        text += `Method: ${this.summaryData.method}\n\n`;
        text += `${'='.repeat(50)}\n\n`;
        text += `SUMMARY:\n${this.summaryData.summary}\n\n`;
        
        if (this.summaryData.facts) {
            text += `FACTS:\n${this.summaryData.facts}\n\n`;
        }
        
        if (this.summaryData.issues) {
            text += `LEGAL ISSUES:\n${this.summaryData.issues}\n\n`;
        }
        
        if (this.summaryData.reasoning) {
            text += `COURT'S REASONING:\n${this.summaryData.reasoning}\n\n`;
        }
        
        if (this.summaryData.judgment) {
            text += `JUDGMENT:\n${this.summaryData.judgment}\n\n`;
        }
        
        if (this.summaryData.key_points && this.summaryData.key_points.length > 0) {
            text += `KEY POINTS:\n`;
            this.summaryData.key_points.forEach((point, i) => {
                text += `${i + 1}. ${point}\n`;
            });
        }
        
        // Create download
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${this.summaryData.case_id || 'case'}_summary.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
    
    toggleDetails() {
        const detailsSection = document.getElementById('detailedSections');
        const toggleBtn = document.getElementById('toggleDetailsBtn');
        
        if (detailsSection.classList.contains('show')) {
            detailsSection.classList.remove('show');
            toggleBtn.innerHTML = 'Show Detailed Breakdown ▼';
        } else {
            detailsSection.classList.add('show');
            toggleBtn.innerHTML = 'Hide Detailed Breakdown ▲';
        }
    }
    
    getRelativeTime(isoString) {
        if (!isoString) return 'Just now';
        
        const date = new Date(isoString);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins} min ago`;
        
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
        
        const diffDays = Math.floor(diffHours / 24);
        return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    }
}

// Initialize widget
const summaryWidget = new CaseSummaryWidget();

// Example usage:
// summaryWidget.loadSummary('SC_2020_123');
// summaryWidget.loadSummary(null, {title: 'Test Case', text: '...', court: 'SC', year: '2020'});
</script>

</body>
</html>
